[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-pdf"
version = "0.6.1"
requires-python = ">=3.12"
description = "Diagnóstico, extração e renderização local de livros"
dependencies = ["html5lib==1.1", "pymupdf==1.28.2", "tinycss2==1.5.1"]

[project.scripts]
kindle-pdf = "kindle_pdf.cli:main"

[project.gui-scripts]
kindle-pdf-gui = "kindle_pdf.gui:launch_gui"

[project.optional-dependencies]
gui = ["PySide6==6.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kindle_pdf._vendor.KindleUnpack" = ["COPYING.txt", "README.md", "SOURCE.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["renderer: exige WEASYPRINT_EXE apontando para o WeasyPrint v70 local"]

[tool.ruff]
exclude = ["src/kindle_pdf/_vendor", ".venv", ".tmp", "build", "dist"]

[tool.mypy]
follow_imports = "silent"
ignore_missing_imports = true
exclude = ["src/kindle_pdf/_vendor"]
